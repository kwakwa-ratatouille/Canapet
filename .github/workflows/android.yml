name: Appli Android
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Code maison (galerie, plein écran, autorisations)
        run: |
          cp native/GalleryPlugin.java native/MainActivity.java android/app/src/main/java/com/canapet/app/
          node native/patch.cjs
      - name: Icône
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ff4f9a' --splashBackgroundColor '#ffe9f3'
      - run: npx cap sync android
      - name: Fabriquer l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Canapet.apk
      - name: Publier (lien fixe android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Appli Android Cana'pet
          body: |
            Appli Android de Cana'pet. Elle ouvre toujours la dernière version du jeu, en plein écran.
            En plus du site : Photo Roulette pioche toute seule des photos au hasard dans la galerie.
            Android demande d'autoriser l'installation depuis cette source : accepte.
          files: mobile/Canapet.apk
          make_latest: false
