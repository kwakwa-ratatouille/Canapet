name: Appli Android
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Icône
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ff4f9a' --splashBackgroundColor '#ffe9f3'
      - run: npx cap sync android
      - name: Code maison (galerie, plein écran, autorisations)
        run: |
          cp native/GalleryPlugin.java native/MainActivity.java android/app/src/main/java/com/canapet/app/
          node native/patch.cjs
      - name: Fabriquer l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Canapet.apk
      - name: Publier (lien fixe android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Appli Android Cana'pet
          body: |
            Appli Android de Cana'pet. Elle ouvre toujours la dernière version du jeu, en plein écran.
            En plus du site : Photo Mystère pioche toute seule des photos au hasard dans la galerie.
            Android demande d'autoriser l'installation depuis cette source : accepte.
          files: mobile/Canapet.apk
          make_latest: false

  # Version pour Google Play : sans accès à la galerie, signée avec la clé d'envoi (secrets GitHub UPLOAD_KEY_*).
  play:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEY_BASE64: ${{ secrets.UPLOAD_KEY_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Icône
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ff4f9a' --splashBackgroundColor '#ffe9f3'
      - run: npx cap sync android
      - name: Code maison (plein écran, signature, version)
        env:
          PLAY: '1'
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN: ${{ secrets.UPLOAD_KEY_BASE64 != '' && '1' || '0' }}
        run: |
          cp native/MainActivity.java native/BillingPlugin.java android/app/src/main/java/com/canapet/app/
          node native/patch.cjs
      - name: Clé d'envoi
        if: env.UPLOAD_KEY_BASE64 != ''
        run: echo "$UPLOAD_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
      - name: Fabriquer le fichier pour Google Play (.aab)
        working-directory: mobile/android
        env:
          UPLOAD_KEY_FILE: ${{ runner.temp }}/upload.p12
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../Canapet-play.aab
      - name: Publier le .aab (lien fixe android-play)
        if: env.UPLOAD_KEY_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-play
          name: Cana'pet pour Google Play
          body: Fichier à envoyer dans la console Google Play (Test fermé, puis Production).
          files: mobile/Canapet-play.aab
          make_latest: false
