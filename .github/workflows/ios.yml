name: Appli iPhone
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install @capacitor/ios@6.1.2
      - run: npx cap add ios
      - name: Code maison (galerie, plein écran, autorisations)
        run: |
          cp native/ios/GalleryPlugin.swift native/ios/MainViewController.swift ios/App/App/
          ruby native/ios/patch.rb
          P=ios/App/App/Info.plist
          plutil -insert NSPhotoLibraryUsageDescription -string "Photo Roulette pioche des photos au hasard dans ta galerie." $P
          plutil -insert NSCameraUsageDescription -string "Pour prendre un selfie comme visage de ton perso." $P
          plutil -insert UIStatusBarHidden -bool YES $P
          plutil -replace CFBundleShortVersionString -string "1.0.${{ github.run_number }}" $P
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" $P
          plutil -replace UIViewControllerBasedStatusBarAppearance -bool YES $P || plutil -insert UIViewControllerBasedStatusBarAppearance -bool YES $P
      - name: Icône
        continue-on-error: true
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#ff4f9a' --splashBackgroundColor '#ffe9f3'
      - run: npx cap sync ios
      - name: Fabriquer l'IPA (non signée)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          test -f Payload/App.app/App
          zip -qr Canapet.ipa Payload
      - name: Source SideStore (mises à jour automatiques)
        run: |
          cat > sidestore.json <<EOF
          {
            "name": "Cana'pet",
            "identifier": "com.canapet.source",
            "subtitle": "Jeux de soirée sur la télé, le téléphone est la manette",
            "iconURL": "https://kwakwa-ratatouille.github.io/Canapet/icon.png",
            "website": "https://kwakwa-ratatouille.github.io/Canapet/",
            "tintColor": "#ff4f9a",
            "apps": [{
              "name": "Cana'pet",
              "bundleIdentifier": "com.canapet.app",
              "developerName": "Cana'pet",
              "subtitle": "La manette de Cana'pet",
              "localizedDescription": "Jeux de soirée multijoueurs sur la télé : ton téléphone sert de manette.",
              "iconURL": "https://kwakwa-ratatouille.github.io/Canapet/icon.png",
              "tintColor": "#ff4f9a",
              "versions": [{
                "version": "1.0.${{ github.run_number }}",
                "buildVersion": "${{ github.run_number }}",
                "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "downloadURL": "https://github.com/kwakwa-ratatouille/Canapet/releases/download/ios-latest/Canapet.ipa",
                "size": $(stat -f%z Canapet.ipa),
                "minOSVersion": "13.0"
              }],
              "appPermissions": { "entitlements": [], "privacy": {
                "NSPhotoLibraryUsageDescription": "Photo Roulette pioche des photos au hasard dans ta galerie.",
                "NSCameraUsageDescription": "Pour prendre un selfie comme visage de ton perso."
              } }
            }],
            "news": []
          }
          EOF
          python3 -m json.tool sidestore.json
      - name: Publier (lien fixe ios-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Appli iPhone Cana'pet
          body: |
            Appli iPhone de Cana'pet (.ipa non signée). Elle ouvre toujours la dernière version du jeu, en plein écran,
            et Photo Roulette pioche toute seule des photos au hasard dans la photothèque.
            À installer avec SideStore (source avec mises à jour automatiques :
            https://github.com/kwakwa-ratatouille/Canapet/releases/download/ios-latest/sidestore.json) ou Sideloadly.
          files: |
            mobile/Canapet.ipa
            mobile/sidestore.json
          make_latest: false
